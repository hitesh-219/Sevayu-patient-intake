<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Intake Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
    .container { max-width: 600px; margin: 20px auto; background: #fff; border-radius: 8px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 20px; color: #1a252c; font-size: 24px; text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="date"], select, textarea {
      width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; background: #fafafa;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #007aff; background: #fff; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; }
    .checkbox-group input { width: auto; cursor: pointer; }
    .checkbox-group label { margin-bottom: 0; font-weight: normal; cursor: pointer; }
    button { width: 100%; padding: 14px; background-color: #007aff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #0056b3; }
    #done { display: none; text-align: center; padding: 40px 20px; }
    #done.on { display: block; }
    #done h3 { color: #28a745; margin-bottom: 10px; }
    .error-msg { color: #dc3545; font-size: 14px; display: none; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- FORM SECTION -->
  <div id="live">
    <h2>Patient Intake Form</h2>
    <form id="intakeForm">
      
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Phone</label>
        <input type="tel" id="mobile" name="mobile" autocomplete="tel" required>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" autocomplete="bday" required>
      </div>

      <div class="form-group">
        <label for="emergencyContact">Emergency Contact (Name & Phone)</label>
        <input type="text" id="emergencyContact" name="emergencyContact" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="reason">Main Reason for Visit / Areas of Focus</label>
        <textarea id="reason" name="reason" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label for="painLevel">Current Pain Level (1 = Mild, 10 = Severe)</label>
        <select id="painLevel" name="painLevel" required>
          <option value="">Select Level</option>
          <option value="None">0 - No Pain</option>
          <option value="1-3">1-3 - Mild</option>
          <option value="4-6">4-6 - Moderate</option>
          <option value="7-9">7-9 - Severe</option>
          <option value="10">10 - Worst Pain Imaginable</option>
        </select>
      </div>

      <div class="form-group">
        <label for="medicalConditions">Medical Conditions / Relevant History</label>
        <textarea id="medicalConditions" name="medicalConditions" rows="2" placeholder="e.g. High blood pressure, arthritis, recent surgeries"></textarea>
      </div>

      <div class="form-group">
        <label for="medications">Current Medications</label>
        <input type="text" id="medications" name="medications" autocomplete="off">
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I confirm that the information provided is accurate and consent to treatment.</label>
      </div>

      <button type="submit" id="submitBtn">Submit Intake Form</button>
      <div id="errorMsg" class="error-msg">Something went wrong. Please try again.</div>
    </form>
  </div>

  <!-- SUCCESS CONFIRMATION -->
  <div id="done">
    <h3>Submission Received!</h3>
    <p>Thank you for filling out your patient intake form. We look forward to seeing you at your appointment.</p>
  </div>

</div>

<script>
  // Replace this string with your exact Apps Script Web App URL from Step 1
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXTj9orGDMhrWvNxCar8X1k61PfdJwwbIl5nncE8L3iy05LAGZgU822HWH01L1VdlS_g/exec';

  document.getElementById('intakeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    errorMsg.style.display = 'none';

    // Build JSON payload from form fields
    const payload = {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      email: document.getElementById('email').value,
      mobile: document.getElementById('mobile').value,
      dob: document.getElementById('dob').value,
      emergencyContact: document.getElementById('emergencyContact').value,
      reason: document.getElementById('reason').value,
      painLevel: document.getElementById('painLevel').value,
      medicalConditions: document.getElementById('medicalConditions').value,
      medications: document.getElementById('medications').value,
      consent: document.getElementById('consent').checked
    };

    // Post data to Google Apps Script bypassing CORS restrictions with mode: 'no-cors'
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    })
    .then(function () {
      // Show success screen
      document.getElementById('live').style.display = 'none';
      document.getElementById('done').classList.add('on');
      window.scrollTo(0, 0);
    })
    .catch(function (err) {
      console.error('Submission Error:', err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Intake Form';
      errorMsg.style.display = 'block';
    });
  });
</script>

</body>
</html>
